spring.application.name=ecommerce-api

# Datasource (override via DB_URL / DB_USERNAME / DB_PASSWORD outside local dev)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Batch lazy loads (items, payments, customers) when mapping order pages, avoiding N+1 queries
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Serialise Page<T> responses as a stable {content, page} JSON shape
spring.data.web.pageable.serialization-mode=via_dto
logging.level.org.hibernate.orm.jdbc.bind=TRACE
